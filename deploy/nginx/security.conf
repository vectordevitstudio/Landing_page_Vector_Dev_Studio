# Заголовки безопасности.
# Подключается через include в server-блоке HTTPS и в каждом location,
# который задаёт собственный add_header — иначе nginx не наследует заголовки
# родителя (правило наследования add_header в nginx).
add_header X-Content-Type-Options    "nosniff"                              always;
add_header X-Frame-Options           "DENY"                                 always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
add_header X-XSS-Protection          "0"                                    always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"  always;

# CSP: только свои ресурсы + Google Fonts (стили/шрифты) и API Web3Forms (форма
# заявки). 'unsafe-inline' в style-src обязателен — Framer Motion пишет inline-стили.
# При смене внешних сервисов обновите соответствующий источник.
add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Сайту не нужны камера, микрофон и геолокация — запрещаем явно
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
